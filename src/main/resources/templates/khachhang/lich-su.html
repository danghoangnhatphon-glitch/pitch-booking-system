<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Lịch sử đặt sân')}"></head>
<body class="page-wrapper">
<nav th:replace="~{fragments/layout :: navbar}"></nav>

<main class="main-content">
  <div class="container">

    <div class="page-header">
      <h1>Lịch đặt của tôi</h1>
      <p>Toàn bộ lịch sử đặt sân của bạn</p>
    </div>

    <div th:if="${#lists.isEmpty(danhSachPhieu)}"
         style="text-align:center;padding:64px 20px;color:var(--slate-400);">
      <div style="font-size:48px;margin-bottom:12px;">📋</div>
      <p style="font-size:16px;margin-bottom:16px;">Bạn chưa đặt sân nào.</p>
      <a th:href="@{/san-bong}" class="btn btn-primary">Tìm sân ngay</a>
    </div>

    <div th:unless="${#lists.isEmpty(danhSachPhieu)}"
         style="display:flex;flex-direction:column;gap:16px;">

      <div th:each="phieu : ${danhSachPhieu}" class="card">
        <div class="card-body">

          <div style="display:flex;justify-content:space-between;align-items:start;flex-wrap:wrap;gap:12px;margin-bottom:16px;">
            <div>
              <div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--white);">
                Phiếu #<span th:text="${phieu.id}">001</span>
              </div>
              <div style="font-size:13px;color:var(--slate-400);margin-top:3px;">
                Đặt ngày <span th:text="${#temporals.format(phieu.createdAt, 'dd/MM/yyyy HH:mm')}">...</span>
              </div>
            </div>

            <div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center;">
              <span th:switch="${phieu.trangThai.name()}">
                <span th:case="'CHO_DUYET'" class="badge badge-pending">⏳ Chờ duyệt</span>
                <span th:case="'DA_DUYET'"  class="badge badge-approved">✅ Đã duyệt</span>
                <span th:case="'DA_HUY'"    class="badge badge-cancelled">❌ Đã hủy</span>
              </span>

              <span th:if="${phieu.trangThai.name() == 'DA_DUYET'}"
                    th:switch="${phieu.trangThaiCoc != null ? phieu.trangThaiCoc.name() : 'CHUA_COC'}">
                <span th:case="'CHUA_COC'" class="badge badge-unpaid">💳 Chưa cọc</span>
                <span th:case="'DA_COC'"   class="badge badge-paid">💰 Đã cọc</span>
              </span>
            </div>
          </div>

          <div style="background:var(--slate-700);border-radius:var(--radius-sm);overflow:hidden;margin-bottom:16px;">
            <div th:each="ct, stat : ${phieu.danhSachChiTiet}"
                 style="display:flex;justify-content:space-between;align-items:center;padding:10px 14px;"
                 th:style="${!stat.last} ? 'border-bottom:1px solid var(--slate-600)' : ''">
              <div>
                <div style="font-weight:600;color:var(--white);font-size:14px;" th:text="${ct.tenSan}">Sân</div>
                <div style="font-size:13px;color:var(--slate-400);">
                  📅 <span th:text="${#temporals.format(ct.ngaySuDung,'dd/MM/yyyy')}">01/06</span>
                  ⏰ <span th:text="${ct.gioBatDau + ' - ' + ct.gioKetThuc}">17:30-19:00</span>
                </div>
              </div>
              <div style="font-family:var(--font-display);font-size:18px;font-weight:700;color:var(--amber);"
                   th:text="${#numbers.formatInteger(ct.donGia,3,'COMMA')} + 'đ'">0đ</div>
            </div>
          </div>

          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:12px;">
            <div>
              <div style="font-size:13px;color:var(--slate-400);">Tổng tiền</div>
              <div style="font-family:var(--font-display);font-size:22px;font-weight:800;color:var(--white);"
                   th:text="${#numbers.formatInteger(phieu.tongTien,3,'COMMA')} + 'đ'">0đ</div>
              <div th:if="${phieu.trangThai.name() == 'DA_DUYET'}"
                   style="font-size:13px;color:var(--green-300);margin-top:2px;">
                Cọc 30%:
                <strong th:text="${#numbers.formatInteger(phieu.tienCoc,3,'COMMA')} + 'đ'">0đ</strong>
              </div>
            </div>

            <div style="display:flex;gap:8px;flex-wrap:wrap;">
              <a th:if="${phieu.trangThai.name() == 'DA_DUYET' and (phieu.trangThaiCoc == null or phieu.trangThaiCoc.name() == 'CHUA_COC')}"
                 th:href="@{/dat-san/{id}/thanh-toan-coc(id=${phieu.id})}"
                 class="btn btn-amber">
                💳 Thanh toán cọc
              </a>

              <button th:if="${phieu.trangThai.name() == 'CHO_DUYET'}"
                      th:onclick="'huyPhieu(' + ${phieu.id} + ')'"
                      class="btn btn-danger btn-sm">
                Hủy phiếu
              </button>

              <button th:if="${phieu.trangThai.name() == 'DA_DUYET' and phieu.trangThaiCoc != null and phieu.trangThaiCoc.name() == 'DA_COC' and phieu.danhGia == null}" th:onclick="moFormDanhGia([[${phieu.id}]], [[${phieu.danhSachChiTiet[0].sanId}]])" class="btn btn-outline" style="border-color: #fbbf24; color: #fbbf24;">
                ⭐ Viết đánh giá
              </button>

              <button th:if="${phieu.danhGia != null}"
                      th:attr="data-phieu-id=${phieu.id},data-san-id=${phieu.danhSachChiTiet[0].sanId},data-so-sao=${phieu.danhGia.soSao},data-noi-dung=${phieu.danhGia.noiDung}"
                      onclick="suaFormDanhGiaTuNut(this)"
                      class="btn btn-outline btn-sm" style="border-color: #fbbf24; color: #fbbf24;">
                ✏️ Sửa đánh giá
              </button>
              <button th:if="${phieu.danhGia != null}" th:onclick="'xoaDanhGia(' + ${phieu.id} + ')'" class="btn btn-danger btn-sm">
                🗑️ Xóa đánh giá
              </button>
            </div>
          </div>

          <div th:if="${phieu.danhGia != null}" style="margin-top:12px;padding:10px 14px;background:var(--slate-700);border-radius:var(--radius-sm);">
            <div style="color:#fbbf24;font-size:14px;" th:text="${'⭐'.repeat(phieu.danhGia.soSao)}">⭐⭐⭐⭐⭐</div>
            <div style="color:var(--slate-300);font-size:13px;margin-top:4px;" th:text="${phieu.danhGia.noiDung}">Nhận xét</div>
          </div>

        </div>
      </div>

    </div>
  </div>

  <div id="formDanhGiaOverlay" style="display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.7); z-index:999;" onclick="dongFormDanhGia()"></div>
  <div id="formDanhGia" style="display:none; position:fixed; top:50%; left:50%; transform:translate(-50%, -50%); background:var(--slate-800); padding:24px; border-radius:var(--radius-md); z-index:1000; width:90%; max-width:400px; border: 1px solid var(--slate-600); box-shadow: 0 10px 25px rgba(0,0,0,0.5);">
    <h3 style="color:var(--white); margin-bottom:16px;">⭐ Đánh giá sân bóng</h3>

    <input type="hidden" id="dg_phieuId">
    <input type="hidden" id="dg_sanId">

    <div style="margin-bottom:16px;">
      <label style="color:var(--slate-300); display:block; margin-bottom:8px; font-size:14px;">Chất lượng sân (Số sao)</label>
      <select id="dg_soSao" style="width: 100%; padding: 10px; background: var(--slate-900); color: white; border: 1px solid var(--slate-600); border-radius: var(--radius-sm); outline: none;">
        <option value="5">⭐⭐⭐⭐⭐ (Tuyệt vời)</option>
        <option value="4">⭐⭐⭐⭐ (Tốt)</option>
        <option value="3">⭐⭐⭐ (Tạm được)</option>
        <option value="2">⭐⭐ (Kém)</option>
        <option value="1">⭐ (Rất tệ)</option>
      </select>
    </div>

    <div style="margin-bottom:20px;">
      <label style="color:var(--slate-300); display:block; margin-bottom:8px; font-size:14px;">Nhận xét của bạn</label>
      <textarea id="dg_noiDung" rows="3" placeholder="Sân đá êm không, đèn sáng không?..." style="width: 100%; padding: 10px; background: var(--slate-900); color: white; border: 1px solid var(--slate-600); border-radius: var(--radius-sm); outline: none;"></textarea>
    </div>

    <div style="display:flex; justify-content:flex-end; gap:12px;">
      <button onclick="dongFormDanhGia()" class="btn btn-outline" style="background: transparent; color: white;">Hủy</button>
      <button onclick="guiDanhGia()" class="btn btn-primary">Gửi Đánh Giá</button>
    </div>
  </div>

</main>

<footer th:replace="~{fragments/layout :: footer}"></footer>
<div th:replace="~{fragments/layout :: toast}"></div>

<script th:src="@{/js/main.js}"></script>
<script>
  // Xử lý Hủy Phiếu
  function huyPhieu(phieuId) {
    if (!confirm('Bạn chắc chắn muốn hủy phiếu này?')) return;
    fetch(`/api/dat-san/${phieuId}/huy`, { method: 'DELETE' })
      .then(r => r.json())
      .then(d => {
        if (d.success) {
          showToast('Hủy phiếu thành công!');
          setTimeout(() => location.reload(), 1000);
        }
        else showToast(d.message, 'error');
      });
  }

  // Xử lý Form Đánh Giá
  let dangSuaDanhGia = false;

  function moFormDanhGia(phieuId, sanId) {
      dangSuaDanhGia = false;
      document.getElementById('dg_phieuId').value = phieuId;
      document.getElementById('dg_sanId').value = sanId;
      document.getElementById('dg_soSao').value = '5';
      document.getElementById('dg_noiDung').value = '';
      document.querySelector('#formDanhGia h3').textContent = '⭐ Đánh giá sân bóng';
      document.getElementById('formDanhGia').style.display = 'block';
      document.getElementById('formDanhGiaOverlay').style.display = 'block';
  }

  function suaFormDanhGia(phieuId, sanId, soSao, noiDung) {
      dangSuaDanhGia = true;
      document.getElementById('dg_phieuId').value = phieuId;
      document.getElementById('dg_sanId').value = sanId;
      document.getElementById('dg_soSao').value = String(soSao);
      document.getElementById('dg_noiDung').value = noiDung;
      document.querySelector('#formDanhGia h3').textContent = '✏️ Sửa đánh giá';
      document.getElementById('formDanhGia').style.display = 'block';
      document.getElementById('formDanhGiaOverlay').style.display = 'block';
  }

  // Đọc data-* attribute từ nút bấm — an toàn với mọi ký tự đặc biệt trong nội dung đánh giá
  function suaFormDanhGiaTuNut(btn) {
      suaFormDanhGia(
          btn.dataset.phieuId,
          btn.dataset.sanId,
          btn.dataset.soSao,
          btn.dataset.noiDung
      );
  }

  function dongFormDanhGia() {
      document.getElementById('formDanhGia').style.display = 'none';
      document.getElementById('formDanhGiaOverlay').style.display = 'none';
      document.getElementById('dg_noiDung').value = '';
  }

  function guiDanhGia() {
      const phieuId = document.getElementById('dg_phieuId').value;
      const data = {
          phieuDatId: parseInt(phieuId),
          sanId: parseInt(document.getElementById('dg_sanId').value),
          soSao: parseInt(document.getElementById('dg_soSao').value),
          noiDung: document.getElementById('dg_noiDung').value
      };

      if(data.noiDung.trim() === '') {
          showToast('Vui lòng nhập nhận xét của bạn!', 'error');
          return;
      }

      const url = dangSuaDanhGia ? `/api/danh-gia/${phieuId}` : '/api/danh-gia';
      const method = dangSuaDanhGia ? 'PUT' : 'POST';

      fetch(url, {
          method: method,
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(data)
      })
      .then(r => r.json())
      .then(d => {
          if (d.success) {
              showToast(dangSuaDanhGia ? 'Cập nhật đánh giá thành công!' : 'Cảm ơn bạn đã đánh giá!');
              dongFormDanhGia();
              setTimeout(() => location.reload(), 1500);
          } else {
              showToast(d.message, 'error');
          }
      })
      .catch(err => {
          console.error(err);
          showToast('Lỗi kết nối, vui lòng thử lại', 'error');
      });
  }

  function xoaDanhGia(phieuId) {
      if (!confirm('Bạn chắc chắn muốn xóa đánh giá này?')) return;
      fetch(`/api/danh-gia/${phieuId}`, { method: 'DELETE' })
      .then(r => r.json())
      .then(d => {
          if (d.success) {
              showToast('Đã xóa đánh giá');
              setTimeout(() => location.reload(), 1000);
          } else {
              showToast(d.message, 'error');
          }
      })
      .catch(() => showToast('Lỗi kết nối, vui lòng thử lại', 'error'));
  }
</script>
</body>
</html>
