<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div style="text-align:center;margin-bottom:24px;">
      <div class="navbar-brand" style="justify-content:center;font-size:28px;">
        ⚽ SÂN BÓNG<span class="dot">.</span>VN
      </div>
    </div>

    <!-- ── Bước 1: Nhập thông tin ─────────────────────────── -->
    <div id="buoc1">
      <div class="auth-title">Đăng ký</div>
      <div class="auth-sub">Tạo tài khoản để đặt sân dễ dàng hơn.</div>

      <div id="loi1" class="alert alert-error" style="display:none;"></div>

      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" id="dk_hoTen" class="form-control" placeholder="Nguyễn Văn A">
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" id="dk_email" class="form-control" placeholder="email@example.com">
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" id="dk_soDienThoai" class="form-control" placeholder="09xxxxxxxx">
        <div style="font-size:12px;color:var(--slate-400);margin-top:4px;">Dùng để nhận mã xác thực OTP</div>
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" id="dk_matKhau" class="form-control" placeholder="Ít nhất 6 ký tự" minlength="6">
      </div>

      <div class="form-group">
        <label>Xác nhận mật khẩu</label>
        <input type="password" id="dk_xacNhanMatKhau" class="form-control" placeholder="Nhập lại mật khẩu">
      </div>

      <button type="button" id="btnGuiOtp" onclick="guiOtp()" class="btn btn-primary btn-lg"
              style="width:100%;justify-content:center;">
        Gửi mã xác thực →
      </button>
    </div>

    <!-- ── Bước 2: Nhập OTP ───────────────────────────────── -->
    <div id="buoc2" style="display:none;">
      <div class="auth-title">Xác thực số điện thoại</div>
      <div class="auth-sub">
        Nhập mã 6 số vừa gửi tới <strong id="sdtHienThi" style="color:var(--green-300);"></strong>
      </div>

      <div id="loi2" class="alert alert-error" style="display:none;"></div>

      <div class="form-group">
        <label>Mã OTP</label>
        <input type="text" id="dk_maOtp" class="form-control" placeholder="123456"
               maxlength="6" inputmode="numeric" style="letter-spacing:6px;font-size:22px;text-align:center;">
      </div>

      <button type="button" id="btnXacNhanOtp" onclick="xacNhanOtp()" class="btn btn-primary btn-lg"
              style="width:100%;justify-content:center;">
        Xác nhận & Tạo tài khoản
      </button>

      <button type="button" onclick="quayLaiBuoc1()" class="btn btn-outline"
              style="width:100%;justify-content:center;margin-top:10px;">
        ← Sửa lại thông tin
      </button>

      <p style="text-align:center;font-size:13px;color:var(--slate-400);margin-top:14px;">
        Không nhận được mã? <a href="#" onclick="guiOtp();return false;" style="color:var(--green-300);">Gửi lại</a>
      </p>
    </div>

    <div class="auth-footer">
      Đã có tài khoản? <a th:href="@{/auth/dang-nhap}">Đăng nhập</a>
    </div>

  </div>
</div>
<script th:src="@{/js/main.js}"></script>
<script>
  let sdtDaGuiOtp = '';

  function hienLoi(elId, msg) {
    const el = document.getElementById(elId);
    el.textContent = '❌ ' + msg;
    el.style.display = 'block';
  }
  function anLoi(elId) {
    document.getElementById(elId).style.display = 'none';
  }

  function layDuLieuForm() {
    return {
      hoTen: document.getElementById('dk_hoTen').value.trim(),
      email: document.getElementById('dk_email').value.trim(),
      soDienThoai: document.getElementById('dk_soDienThoai').value.trim(),
      matKhau: document.getElementById('dk_matKhau').value,
      xacNhanMatKhau: document.getElementById('dk_xacNhanMatKhau').value
    };
  }

  function guiOtp() {
    anLoi('loi1');
    const data = layDuLieuForm();

    if (!data.hoTen || !data.email || !data.soDienThoai || !data.matKhau) {
      hienLoi('loi1', 'Vui lòng điền đầy đủ thông tin'); return;
    }
    if (data.matKhau.length < 6) {
      hienLoi('loi1', 'Mật khẩu phải từ 6 ký tự trở lên'); return;
    }
    if (data.matKhau !== data.xacNhanMatKhau) {
      hienLoi('loi1', 'Mật khẩu xác nhận không khớp'); return;
    }
    if (!/^(03|05|07|08|09)\d{8}$/.test(data.soDienThoai)) {
      hienLoi('loi1', 'Số điện thoại không hợp lệ'); return;
    }

    const btn = document.getElementById('btnGuiOtp');
    btn.disabled = true;
    btn.textContent = 'Đang gửi mã...';

    // Chỉ gửi đúng các field mà DangKyRequest có ở backend
    // (xacNhanMatKhau chỉ dùng để validate phía client, không gửi lên server)
    const payload = {
      hoTen: data.hoTen,
      email: data.email,
      soDienThoai: data.soDienThoai,
      matKhau: data.matKhau
    };

    fetch('/api/auth/gui-otp-dang-ky', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    })
    .then(r => r.json())
    .then(d => {
      btn.disabled = false;
      btn.textContent = 'Gửi mã xác thực →';
      if (d.success) {
        sdtDaGuiOtp = data.soDienThoai;
        document.getElementById('sdtHienThi').textContent = data.soDienThoai;
        document.getElementById('buoc1').style.display = 'none';
        document.getElementById('buoc2').style.display = 'block';
        document.getElementById('dk_maOtp').value = '';
        document.getElementById('dk_maOtp').focus();
        showToast(d.message);
      } else {
        hienLoi('loi1', d.message);
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'Gửi mã xác thực →';
      hienLoi('loi1', 'Lỗi kết nối, vui lòng thử lại');
    });
  }

  function xacNhanOtp() {
    anLoi('loi2');
    const maOtp = document.getElementById('dk_maOtp').value.trim();

    if (!/^\d{6}$/.test(maOtp)) {
      hienLoi('loi2', 'Mã OTP gồm 6 chữ số'); return;
    }

    const btn = document.getElementById('btnXacNhanOtp');
    btn.disabled = true;
    btn.textContent = 'Đang xác thực...';

    fetch('/api/auth/xac-nhan-otp-dang-ky', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ soDienThoai: sdtDaGuiOtp, maOtp: maOtp })
    })
    .then(r => r.json())
    .then(d => {
      if (d.success) {
        showToast('Đăng ký thành công! Đang chuyển đến trang đăng nhập...');
        setTimeout(() => window.location.href = '/auth/dang-nhap', 1500);
      } else {
        btn.disabled = false;
        btn.textContent = 'Xác nhận & Tạo tài khoản';
        hienLoi('loi2', d.message);
      }
    })
    .catch(() => {
      btn.disabled = false;
      btn.textContent = 'Xác nhận & Tạo tài khoản';
      hienLoi('loi2', 'Lỗi kết nối, vui lòng thử lại');
    });
  }

  function quayLaiBuoc1() {
    document.getElementById('buoc2').style.display = 'none';
    document.getElementById('buoc1').style.display = 'block';
  }
</script>
</body>
</html>
