<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đăng ký')}"></head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <div style="text-align:center;margin-bottom:24px;">
      <div class="navbar-brand" style="justify-content:center;font-size:28px;">
        ⚽ SÂN BÓNG<span class="dot">.</span>VN
      </div>
    </div>

    <div class="auth-title">Đăng ký</div>
    <div class="auth-sub">Tạo tài khoản để đặt sân dễ dàng hơn.</div>

    <div th:if="${errorMessage}" class="alert alert-error">
      ❌ <span th:text="${errorMessage}">Lỗi</span>
    </div>

    <form th:action="@{/auth/dang-ky}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label>Họ và tên</label>
        <input type="text" name="hoTen" class="form-control"
               placeholder="Nguyễn Văn A" required
               th:value="${hoTen}"/>
      </div>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="email" class="form-control"
               placeholder="email@example.com" required
               th:value="${email}"/>
      </div>

      <div class="form-group">
        <label>Số điện thoại</label>
        <input type="tel" name="soDienThoai" class="form-control"
               placeholder="09xxxxxxxx"
               th:value="${soDienThoai}"/>
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="matKhau" class="form-control"
               placeholder="Ít nhất 6 ký tự" required minlength="6"/>
      </div>

      <div class="form-group">
        <label>Xác nhận mật khẩu</label>
        <input type="password" name="xacNhanMatKhau" class="form-control"
               placeholder="Nhập lại mật khẩu" required/>
      </div>

      <button type="submit" class="btn btn-primary btn-lg"
              style="width:100%;justify-content:center;">
        Tạo tài khoản →
      </button>
    </form>

    <div class="auth-footer">
      Đã có tài khoản? <a th:href="@{/auth/dang-nhap}">Đăng nhập</a>
    </div>

  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
