<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="vi">
<head th:replace="~{fragments/layout :: head('Đăng nhập')}"></head>
<body>
<div class="auth-wrapper">
  <div class="auth-card">

    <!-- Logo -->
    <div style="text-align:center;margin-bottom:24px;">
      <div class="navbar-brand" style="justify-content:center;font-size:28px;">
        ⚽ SÂN BÓNG<span class="dot">.</span>VN
      </div>
    </div>

    <div class="auth-title">Đăng nhập</div>
    <div class="auth-sub">Chào mừng trở lại! Nhập thông tin của bạn.</div>

    <!-- Thông báo lỗi từ Spring Security -->
    <div th:if="${param.error}" class="alert alert-error">
      ❌ Email hoặc mật khẩu không đúng
    </div>
    <div th:if="${param.logout}" class="alert alert-success">
      ✅ Đăng xuất thành công
    </div>

    <!-- Form đăng nhập — action trỏ đến Spring Security login endpoint -->
    <form th:action="@{/auth/login}" method="post">
      <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>

      <div class="form-group">
        <label>Email</label>
        <input type="email" name="username" class="form-control"
               placeholder="email@example.com" required autofocus/>
      </div>

      <div class="form-group">
        <label>Mật khẩu</label>
        <input type="password" name="password" class="form-control"
               placeholder="Nhập mật khẩu" required/>
      </div>

      <button type="submit" class="btn btn-primary btn-lg" style="width:100%;justify-content:center;">
        Đăng nhập →
      </button>
    </form>

    <div class="auth-footer">
      Chưa có tài khoản?
      <a th:href="@{/auth/dang-ky}">Đăng ký ngay</a>
    </div>

  </div>
</div>
<script th:src="@{/js/main.js}"></script>
</body>
</html>
